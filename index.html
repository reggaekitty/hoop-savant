<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoop Savant — NBA Defense & Hustle Analytics</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-hover: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3b82f6;
      --elite: #ef4444;
      --good: #f97316;
      --avg: #64748b;
      --poor: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.35);
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      background: var(--bg);
      padding: 0.25rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.25rem 1.5rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      background: var(--surface);
      padding: 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .control-group label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    select, input {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.65rem;
      font-size: 0.875rem;
      outline: none;
    }
    select:focus, input:focus {
      border-color: var(--accent);
    }
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      padding: 0.7rem 0.85rem;
      text-align: right;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th:first-child, td:first-child,
    th:nth-child(2), td:nth-child(2) {
      text-align: left;
    }
    th {
      background: #12171f;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--text); }
    tbody tr { cursor: pointer; transition: background 0.12s ease; }
    tbody tr:hover { background: var(--surface-hover); }
    .player-name { font-weight: 600; color: #fff; }
    .team-tag {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .pct-pill {
      display: inline-block;
      min-width: 34px;
      text-align: center;
      padding: 0.15rem 0.4rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
    }
    /* Savant-style percentile card modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      padding: 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.25rem;
    }
    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .bar-row {
      display: grid;
      grid-template-columns: 165px 1fr 56px;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
      font-size: 0.82rem;
    }
    .bar-track {
      height: 12px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }
    .status-msg {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Hoop Savant</h1>
      <span class="badge">Defense &amp; Hustle Engine</span>
    </div>
    <div class="tabs" id="viewTabs">
      <button class="tab-btn active" data-view="overview">Defense Overview</button>
      <button class="tab-btn" data-view="zones">Shot Zones &amp; DFG%</button>
      <button class="tab-btn" data-view="hustle">Hustle &amp; Activity</button>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <div class="control-group">
        <label for="seasonSelect">Season</label>
        <select id="seasonSelect">
          <option value="2025-26">2025-26</option>
          <option value="2024-25" selected>2024-25</option>
          <option value="2023-24">2023-24</option>
          <option value="2022-23">2022-23</option>
          <option value="2021-22">2021-22</option>
          <option value="2020-21">2020-21</option>
          <option value="2019-20">2019-20</option>
          <option value="2018-19">2018-19</option>
          <option value="2017-18">2017-18</option>
          <option value="2016-17">2016-17</option>
          <option value="2015-16">2015-16</option>
        </select>
      </div>
      <div class="control-group">
        <label for="teamSelect">Team</label>
        <select id="teamSelect"><option value="ALL">All Teams</option></select>
      </div>
      <div class="control-group">
        <label for="minGpInput">Min Games Played</label>
        <input type="number" id="minGpInput" value="20" min="1" max="82" />
      </div>
      <div class="control-group">
        <label for="searchInput">Search Player</label>
        <input type="text" id="searchInput" placeholder="e.g. Wembanyama, Caruso..." />
      </div>
    </div>

    <div class="table-wrap">
      <table id="statsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody">
          <tr><td colspan="10" class="status-msg">Loading defensive dataset...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Player Savant Percentile Card Modal -->
  <div class="modal-backdrop" id="playerModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modalPlayerName">Player Name</h2>
          <p id="modalPlayerMeta" style="color: var(--muted); font-size: 0.85rem;"></p>
        </div>
        <button class="close-btn" id="closeModalBtn">Close</button>
      </div>
      <div id="modalBars"></div>
    </div>
  </div>

  <script>
    let allPlayers = [];
    let currentView = "overview";
    let sortKey = "DEF_WS";
    let sortAsc = false;

    const VIEWS = {
      overview: [
        { key: "PLAYER_NAME", label: "Player" },
        { key: "TEAM_ABBREVIATION", label: "Team" },
        { key: "GP", label: "GP" },
        { key: "MIN", label: "MIN" },
        { key: "DEF_RATING", label: "DEF RTG", pctKey: "DEF_RATING_PCT" },
        { key: "D_FG_PCT", label: "DFG%", pctKey: "D_FG_PCT_PCT" },
        { key: "PCT_PLUSMINUS", label: "DIFF%", pctKey: "PCT_PLUSMINUS_PCT" },
        { key: "STL", label: "STL", pctKey: "STL_PCT" },
        { key: "BLK", label: "BLK", pctKey: "BLK_PCT" },
        { key: "DREB_PCT", label: "DREB%", pctKey: "DREB_PCT_PCT" },
        { key: "DEF_WS", label: "DWS", pctKey: "DEF_WS_PCT" }
      ],
      zones: [
        { key: "PLAYER_NAME", label: "Player" },
        { key: "TEAM_ABBREVIATION", label: "Team" },
        { key: "D_FGA", label: "DFGA" },
        { key: "D_FG_PCT", label: "Overall DFG%", pctKey: "D_FG_PCT_PCT" },
        { key: "PCT_PLUSMINUS", label: "Overall Diff%" },
        { key: "LT_06_FG_PCT", label: "<6ft Rim DFG%", pctKey: "LT_06_FG_PCT_PCT" },
        { key: "LT_06_PLUSMINUS", label: "<6ft Diff%" },
        { key: "GT_15_FG_PCT", label: ">15ft Perim DFG%", pctKey: "GT_15_FG_PCT_PCT" },
        { key: "GT_15_PLUSMINUS", label: ">15ft Diff%" }
      ],
      hustle: [
        { key: "PLAYER_NAME", label: "Player" },
        { key: "TEAM_ABBREVIATION", label: "Team" },
        { key: "MIN", label: "MIN" },
        { key: "CONTESTED_SHOTS", label: "Contested", pctKey: "CONTESTED_SHOTS_PCT" },
        { key: "CONTESTED_SHOTS_2PT", label: "2PT Cont" },
        { key: "CONTESTED_SHOTS_3PT", label: "3PT Cont" },
        { key: "DEFLECTIONS", label: "Deflections", pctKey: "DEFLECTIONS_PCT" },
        { key: "LOOSE_BALLS_RECOVERED", label: "Loose Balls", pctKey: "LOOSE_BALLS_RECOVERED_PCT" },
        { key: "CHARGES_DRAWN", label: "Charges", pctKey: "CHARGES_DRAWN_PCT" },
        { key: "BOX_OUTS", label: "Box Outs", pctKey: "BOX_OUTS_PCT" }
      ]
    };

    function pctColor(pct) {
      if (pct == null) return "#334155";
      if (pct >= 85) return "#dc2626";
      if (pct >= 65) return "#ea580c";
      if (pct >= 40) return "#475569";
      return "#0284c7";
    }

    async function loadSeason(season) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="11" class="status-msg">Loading data/defense-${season}.json...</td></tr>`;
      try {
        const res = await fetch(`data/defense-${season}.json`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allPlayers = data.players || [];
        populateTeams();
        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="11" class="status-msg">Could not load <code>data/defense-${season}.json</code>. Run <code>python update_data.py</code> first.</td></tr>`;
      }
    }

    function populateTeams() {
      const select = document.getElementById("teamSelect");
      const teams = [...new Set(allPlayers.map(p => p.TEAM_ABBREVIATION).filter(Boolean))].sort();
      select.innerHTML = `<option value="ALL">All Teams</option>` +
        teams.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function renderTable() {
      const cols = VIEWS[currentView];
      const thead = document.getElementById("tableHead");
      thead.innerHTML = `<tr>${cols.map(c => `<th data-key="${c.key}">${c.label}${sortKey === c.key ? (sortAsc ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>`;

      thead.querySelectorAll("th").forEach(th => {
        th.addEventListener("click", () => {
          const k = th.dataset.key;
          if (sortKey === k) sortAsc = !sortAsc;
          else { sortKey = k; sortAsc = false; }
          renderTable();
        });
      });

      const team = document.getElementById("teamSelect").value;
      const minGp = parseInt(document.getElementById("minGpInput").value || "0", 10);
      const q = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = allPlayers.filter(p => {
        if (team !== "ALL" && p.TEAM_ABBREVIATION !== team) return false;
        if ((p.GP || 0) < minGp) return false;
        if (q && !(p.PLAYER_NAME || "").toLowerCase().includes(q)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        const va = a[sortKey];
        const vb = b[sortKey];
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === "string") return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortAsc ? va - vb : vb - va;
      });

      const tbody = document.getElementById("tableBody");
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="${cols.length}" class="status-msg">No players match current filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.slice(0, 150).map(p => {
        const cells = cols.map(c => {
          const val = p[c.key];
          if (c.key === "PLAYER_NAME") return `<td class="player-name">${val ?? "-"}</td>`;
          if (c.key === "TEAM_ABBREVIATION") return `<td><span class="team-tag">${val ?? "-"}</span></td>`;
          if (c.pctKey && p[c.pctKey] != null) {
            const pct = p[c.pctKey];
            return `<td>${val ?? "-"} <span class="pct-pill" style="background:${pctColor(pct)}">${pct}</span></td>`;
          }
          return `<td>${val ?? "-"}</td>`;
        }).join("");
        return `<tr data-pid="${p.PLAYER_ID}">${cells}</tr>`;
      }).join("");

      tbody.querySelectorAll("tr").forEach(tr => {
        tr.addEventListener("click", () => {
          const pid = Number(tr.dataset.pid);
          const player = allPlayers.find(x => x.PLAYER_ID === pid);
          if (player) openModal(player);
        });
      });
    }

    function openModal(p) {
      document.getElementById("modalPlayerName").textContent = p.PLAYER_NAME;
      document.getElementById("modalPlayerMeta").textContent =
        `${p.TEAM_ABBREVIATION} • ${p.GP} GP • ${p.MIN} MPG • Def Rating: ${p.DEF_RATING ?? "-"}`;

      const metrics = [
        { label: "Defensive Rating", val: p.DEF_RATING, pct: p.DEF_RATING_PCT },
        { label: "Overall Opponent FG%", val: p.D_FG_PCT != null ? p.D_FG_PCT + "%" : "-", pct: p.D_FG_PCT_PCT },
        { label: "FG% Differential", val: p.PCT_PLUSMINUS != null ? p.PCT_PLUSMINUS + "%" : "-", pct: p.PCT_PLUSMINUS_PCT },
        { label: "Rim Protection (<6ft)", val: p.LT_06_FG_PCT != null ? p.LT_06_FG_PCT + "%" : "-", pct: p.LT_06_FG_PCT_PCT },
        { label: "Perimeter DFG% (>15ft)", val: p.GT_15_FG_PCT != null ? p.GT_15_FG_PCT + "%" : "-", pct: p.GT_15_FG_PCT_PCT },
        { label: "Contested Shots / G", val: p.CONTESTED_SHOTS, pct: p.CONTESTED_SHOTS_PCT },
        { label: "Deflections / G", val: p.DEFLECTIONS, pct: p.DEFLECTIONS_PCT },
        { label: "Steals / G", val: p.STL, pct: p.STL_PCT },
        { label: "Blocks / G", val: p.BLK, pct: p.BLK_PCT },
        { label: "Defensive Reb %", val: p.DREB_PCT != null ? p.DREB_PCT + "%" : "-", pct: p.DREB_PCT_PCT },
        { label: "Loose Balls / G", val: p.LOOSE_BALLS_RECOVERED, pct: p.LOOSE_BALLS_RECOVERED_PCT },
        { label: "Box Outs / G", val: p.BOX_OUTS, pct: p.BOX_OUTS_PCT },
        { label: "Defensive Win Shares", val: p.DEF_WS, pct: p.DEF_WS_PCT }
      ];

      document.getElementById("modalBars").innerHTML = metrics.map(m => {
        const pct = m.pct ?? 0;
        return `
          <div class="bar-row">
            <div><strong>${m.label}</strong> <span style="color:var(--muted)">(${m.val ?? "-"})</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${pctColor(m.pct)}"></div></div>
            <div style="text-align:right"><span class="pct-pill" style="background:${pctColor(m.pct)}">${m.pct ?? "-"}</span></div>
          </div>
        `;
      }).join("");

      document.getElementById("playerModal").classList.add("open");
    }

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("playerModal").classList.remove("open");
    });
    document.getElementById("playerModal").addEventListener("click", (e) => {
      if (e.target.id === "playerModal") e.target.classList.remove("open");
    });

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        renderTable();
      });
    });

    document.getElementById("seasonSelect").addEventListener("change", (e) => loadSeason(e.target.value));
    document.getElementById("teamSelect").addEventListener("change", renderTable);
    document.getElementById("minGpInput").addEventListener("input", renderTable);
    document.getElementById("searchInput").addEventListener("input", renderTable);

    loadSeason("2024-25");
  </script>
</body>
</html>
