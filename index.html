<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoop Savant — Shooting & Defense Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #192133;
      --surface-hover: #1e283d;
      --border: #263147;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      overflow-x: hidden;
    }

    /* Centered Header & Main Wrapper */
    header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 1rem 0;
    }

    .header-inner,
    .container {
      width: 96%;
      max-width: 1720px;
      margin-left: auto;
      margin-right: auto;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .brand-title span {
      color: var(--accent);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .container {
      padding-top: 1.25rem;
      padding-bottom: 2.5rem;
    }

    /* Filter Bar */
    .controls-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 0.85rem;
      align-items: end;
      width: 100%;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .control-group label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    select,
    input {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.48rem 0.65rem;
      font-size: 0.84rem;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--accent-blue);
    }

    /* Leaderboard Card */
    .leaderboard-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.15rem 1.25rem;
      width: 100%;
    }

    .leaderboard-header {
      margin-bottom: 0.9rem;
    }

    .leaderboard-header h2 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .leaderboard-header p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    /* Centered & Contained Scrollable Table */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
    }

    table {
      width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    th,
    td {
      padding: 0.5rem 0.42rem;
      text-align: center;
      vertical-align: middle;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    /* Keep Rank centered, Player Name left-aligned */
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
      padding-left: 0.65rem;
      padding-right: 0.75rem;
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th:hover {
      color: var(--text);
    }

    tbody tr {
      cursor: pointer;
      transition: background 0.12s ease;
    }

    tbody tr:hover {
      background: var(--surface-hover);
    }

    .rank-cell {
      color: var(--muted);
      font-weight: 600;
      width: 36px;
    }

    .player-name {
      font-weight: 600;
      color: #ffffff;
    }

    .team-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.1rem 0.38rem;
    }

    .stat-pair {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
    }

    .pct-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 19px;
      padding: 0 0.35rem;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      color: #ffffff;
    }

    .status-msg {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer {
      margin-top: 1.25rem;
      font-size: 0.74rem;
      color: var(--muted);
      text-align: center;
    }

    /* Player Savant Percentile Card Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 680px;
      width: 100%;
      padding: 1.5rem;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.9rem;
      margin-bottom: 1.15rem;
    }

    .close-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.32rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 185px 1fr 48px;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
      font-size: 0.8rem;
    }

    .bar-track {
      height: 12px;
      background: var(--bg);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-title">HOOP <span>SAVANT</span></div>
      <div class="brand-sub">Shooting &amp; Defense Dashboard &middot; percentile rankings &amp; shot charts</div>
    </div>
  </header>

  <main class="container">
    <section class="controls-card">
      <div class="control-group">
        <label for="viewSelect">View</label>
        <select id="viewSelect">
          <option value="defense" selected>Defense</option>
          <option value="shooting">Shooting</option>
        </select>
      </div>

      <div class="control-group">
        <label for="seasonSelect">Season</label>
        <select id="seasonSelect">
          <option value="2026-27" selected>2026-27</option>
          <option value="2025-26">2025-26</option>
          <option value="2024-25">2024-25</option>
          <option value="2023-24">2023-24</option>
          <option value="2022-23">2022-23</option>
          <option value="2021-22">2021-22</option>
          <option value="2020-21">2020-21</option>
          <option value="2019-20">2019-20</option>
          <option value="2018-19">2018-19</option>
          <option value="2017-18">2017-18</option>
          <option value="2016-17">2016-17</option>
        </select>
      </div>

      <div class="control-group">
        <label for="rangeSelect">Defended Shot</label>
        <select id="rangeSelect">
          <option value="overall" selected>Overall</option>
          <option value="rim">Less Than 6Ft</option>
          <option value="perimeter">Greater Than 15Ft</option>
        </select>
      </div>

      <div class="control-group">
        <label for="perModeSelect">Per Mode</label>
        <select id="perModeSelect">
          <option value="PerGame" selected>Per Game</option>
        </select>
      </div>

      <div class="control-group">
        <label for="teamSelect">Team</label>
        <select id="teamSelect">
          <option value="ALL" selected>All Teams</option>
        </select>
      </div>

      <div class="control-group">
        <label for="minGpInput">Min Games</label>
        <input type="number" id="minGpInput" value="10" min="1" max="82" />
      </div>

      <div class="control-group">
        <label for="searchInput">Search</label>
        <input type="text" id="searchInput" placeholder="Player name" />
      </div>
    </section>

    <section class="leaderboard-card">
      <div class="leaderboard-header">
        <h2>Leaderboard</h2>
        <p>Tap any column header to sort. Tap a row to open the player card below.</p>
      </div>

      <div class="table-wrap">
        <table id="statsTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody">
            <tr><td colspan="20" class="status-msg">Loading dataset...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <footer id="footerMeta">
      Data: NBA.com dashboard via nba_api (regular seasons). Percentiles are ranked among qualified players.
    </footer>
  </main>

  <!-- Player Savant Percentile Card Modal -->
  <div class="modal-backdrop" id="playerModal">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modalPlayerName">Player Name</h2>
          <p id="modalPlayerMeta" style="color: var(--muted); font-size: 0.82rem; margin-top: 0.2rem;"></p>
        </div>
        <button class="close-btn" id="closeModalBtn">Close</button>
      </div>
      <div id="modalBars"></div>
    </div>
  </div>

  <script>
    let allPlayers = [];
    let currentView = "defense";
    let currentRange = "overall";
    let sortKey = "D_FG_PCT";
    let sortAsc = true;

    const DEFENSE_COLUMNS = {
      overall: [
        { key: "PLAYER_NAME", label: "PLAYER" },
        { key: "TEAM_ABBREVIATION", label: "TEAM" },
        { key: "AGE", label: "AGE" },
        { key: "GP", label: "GP" },
        { key: "MIN", label: "MIN" },
        { key: "DEF_RATING", label: "DEF RTG", pctKey: "DEF_RATING_PCT" },
        { key: "DREB", label: "DREB" },
        { key: "DREB_PCT", label: "DREB%", pctKey: "DREB_PCT_PCT" },
        { key: "STL", label: "STL", pctKey: "STL_PCT" },
        { key: "BLK", label: "BLK", pctKey: "BLK_PCT" },
        { key: "DEF_WS", label: "DWS", pctKey: "DEF_WS_PCT" },
        { key: "CONTESTED_SHOTS", label: "CONTESTED", pctKey: "CONTESTED_SHOTS_PCT" },
        { key: "DEFLECTIONS", label: "DEFL", pctKey: "DEFLECTIONS_PCT" },
        { key: "CHARGES_DRAWN", label: "CHARGES", pctKey: "CHARGES_DRAWN_PCT" },
        { key: "D_FGA", label: "DFGA" },
        { key: "D_FG_PCT", label: "DFG%", pctKey: "D_FG_PCT_PCT" },
        { key: "NORMAL_FG_PCT", label: "NORMAL" },
        { key: "PCT_PLUSMINUS", label: "DIFF%", pctKey: "PCT_PLUSMINUS_PCT" }
      ],
      rim: [
        { key: "PLAYER_NAME", label: "PLAYER" },
        { key: "TEAM_ABBREVIATION", label: "TEAM" },
        { key: "AGE", label: "AGE" },
        { key: "GP", label: "GP" },
        { key: "MIN", label: "MIN" },
        { key: "BLK", label: "BLK", pctKey: "BLK_PCT" },
        { key: "CONTESTED_SHOTS_2PT", label: "2PT CONT" },
        { key: "LT_06_FG_PCT", label: "<6FT DFG%", pctKey: "LT_06_FG_PCT_PCT" },
        { key: "LT_06_PLUSMINUS", label: "<6FT DIFF%" }
      ],
      perimeter: [
        { key: "PLAYER_NAME", label: "PLAYER" },
        { key: "TEAM_ABBREVIATION", label: "TEAM" },
        { key: "AGE", label: "AGE" },
        { key: "GP", label: "GP" },
        { key: "MIN", label: "MIN" },
        { key: "STL", label: "STL", pctKey: "STL_PCT" },
        { key: "DEFLECTIONS", label: "DEFL", pctKey: "DEFLECTIONS_PCT" },
        { key: "CONTESTED_SHOTS_3PT", label: "3PT CONT" },
        { key: "GT_15_FG_PCT", label: ">15FT DFG%", pctKey: "GT_15_FG_PCT_PCT" },
        { key: "GT_15_PLUSMINUS", label: ">15FT DIFF%" }
      ]
    };

    const SHOOTING_COLUMNS = [
      { key: "PLAYER_NAME", label: "PLAYER" },
      { key: "TEAM_ABBREVIATION", label: "TEAM" },
      { key: "AGE", label: "AGE" },
      { key: "GP", label: "GP" },
      { key: "MIN", label: "MIN" },
      { key: "PTS", label: "PTS", pctKey: "PTS_PCT" },
      { key: "FGA", label: "FGA" },
      { key: "FG_PCT", label: "FG%", pctKey: "FG_PCT_PCT" },
      { key: "FG3A", label: "3PA" },
      { key: "FG3_PCT", label: "3P%", pctKey: "FG3_PCT_PCT" },
      { key: "EFG_PCT", label: "eFG%", pctKey: "EFG_PCT_PCT" },
      { key: "TS_PCT", label: "TS%", pctKey: "TS_PCT_PCT" }
    ];

    function pctColor(pct) {
      if (pct == null) return "#334155";
      if (pct >= 85) return "#dc2626";
      if (pct >= 65) return "#ea580c";
      if (pct >= 40) return "#475569";
      return "#0284c7";
    }

    async function loadDataset() {
      const season = document.getElementById("seasonSelect").value;
      const tbody = document.getElementById("tableBody");
      const filePrefix = currentView === "defense" ? "defense" : "shooting";
      const filePath = `data/${filePrefix}-${season}.json`;

      tbody.innerHTML = `<tr><td colspan="20" class="status-msg">Loading ${filePath}...</td></tr>`;

      try {
        const res = await fetch(filePath);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allPlayers = Array.isArray(data) ? data : (data.players || []);

        if (data.updated_at) {
          document.getElementById("footerMeta").textContent =
            `Data: NBA.com dashboard via nba_api (regular seasons; last updated ${new Date(data.updated_at).toLocaleString()}). Percentiles are ranked among qualified players.`;
        }

        populateTeams();
        renderTable();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="20" class="status-msg">Couldn't load data from <code>${filePath}</code>. Make sure the JSON file exists in <code>data/</code> and open via GitHub Pages or a local web server.</td></tr>`;
      }
    }

    function populateTeams() {
      const select = document.getElementById("teamSelect");
      const current = select.value;
      const teams = [...new Set(allPlayers.map(p => p.TEAM_ABBREVIATION || p.TEAM).filter(Boolean))].sort();
      select.innerHTML = `<option value="ALL">All Teams</option>` +
        teams.map(t => `<option value="${t}" ${t === current ? "selected" : ""}>${t}</option>`).join("");
    }

    function renderTable() {
      const cols = currentView === "defense"
        ? (DEFENSE_COLUMNS[currentRange] || DEFENSE_COLUMNS.overall)
        : SHOOTING_COLUMNS;

      const thead = document.getElementById("tableHead");
      thead.innerHTML = `<tr>
        <th>#</th>
        ${cols.map(c => `<th data-key="${c.key}">${c.label}${sortKey === c.key ? (sortAsc ? " ▲" : " ▼") : ""}</th>`).join("")}
      </tr>`;

      thead.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => {
          const k = th.dataset.key;
          if (sortKey === k) {
            sortAsc = !sortAsc;
          } else {
            sortKey = k;
            sortAsc = ["DEF_RATING", "D_FG_PCT", "PCT_PLUSMINUS", "LT_06_FG_PCT", "GT_15_FG_PCT"].includes(k);
          }
          renderTable();
        });
      });

      const team = document.getElementById("teamSelect").value;
      const minGp = parseInt(document.getElementById("minGpInput").value || "0", 10);
      const query = document.getElementById("searchInput").value.trim().toLowerCase();

      const filtered = allPlayers.filter(p => {
        const pTeam = p.TEAM_ABBREVIATION || p.TEAM;
        const pName = p.PLAYER_NAME || p.PLAYER || "";
        if (team !== "ALL" && pTeam !== team) return false;
        if ((p.GP || 0) < minGp) return false;
        if (query && !pName.toLowerCase().includes(query)) return false;
        return true;
      });

      filtered.sort((a, b) => {
        const va = a[sortKey];
        const vb = b[sortKey];
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === "string") return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortAsc ? va - vb : vb - va;
      });

      const tbody = document.getElementById("tableBody");
      if (!filtered.length) {
        tbody.innerHTML = `<tr><td colspan="${cols.length + 1}" class="status-msg">No players match the current filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.slice(0, 200).map((p, idx) => {
        const cells = cols.map(c => {
          const val = p[c.key] ?? (c.key === "PLAYER_NAME" ? p.PLAYER : (c.key === "TEAM_ABBREVIATION" ? p.TEAM : null));
          if (c.key === "PLAYER_NAME") {
            return `<td class="player-name">${val ?? "-"}</td>`;
          }
          if (c.key === "TEAM_ABBREVIATION") {
            return `<td><span class="team-badge">${val ?? "-"}</span></td>`;
          }
          if (c.pctKey && p[c.pctKey] != null) {
            const pct = p[c.pctKey];
            return `<td><span class="stat-pair"><span>${val ?? "-"}</span><span class="pct-pill" style="background:${pctColor(pct)}">${pct}</span></span></td>`;
          }
          return `<td>${val ?? "-"}</td>`;
        }).join("");

        return `<tr data-idx="${idx}"><td class="rank-cell">${idx + 1}</td>${cells}</tr>`;
      }).join("");

      tbody.querySelectorAll("tr").forEach(tr => {
        tr.addEventListener("click", () => {
          const player = filtered[Number(tr.dataset.idx)];
          if (player) openModal(player);
        });
      });
    }

    function openModal(p) {
      const name = p.PLAYER_NAME || p.PLAYER || "Player";
      const team = p.TEAM_ABBREVIATION || p.TEAM || "";
      document.getElementById("modalPlayerName").textContent = name;
      document.getElementById("modalPlayerMeta").textContent =
        `${team} • ${p.GP ?? "-"} GP • ${p.MIN ?? "-"} MIN • Def Rating: ${p.DEF_RATING ?? "-"}`;

      const metrics = [
        { label: "Defensive Rating", val: p.DEF_RATING, pct: p.DEF_RATING_PCT },
        { label: "Overall DFG%", val: p.D_FG_PCT != null ? p.D_FG_PCT + "%" : "-", pct: p.D_FG_PCT_PCT },
        { label: "FG% Differential", val: p.PCT_PLUSMINUS != null ? p.PCT_PLUSMINUS + "%" : "-", pct: p.PCT_PLUSMINUS_PCT },
        { label: "Rim DFG% (<6ft)", val: p.LT_06_FG_PCT != null ? p.LT_06_FG_PCT + "%" : "-", pct: p.LT_06_FG_PCT_PCT },
        { label: "Perimeter DFG% (>15ft)", val: p.GT_15_FG_PCT != null ? p.GT_15_FG_PCT + "%" : "-", pct: p.GT_15_FG_PCT_PCT },
        { label: "Contested Shots", val: p.CONTESTED_SHOTS, pct: p.CONTESTED_SHOTS_PCT },
        { label: "Deflections", val: p.DEFLECTIONS, pct: p.DEFLECTIONS_PCT },
        { label: "Charges Drawn", val: p.CHARGES_DRAWN, pct: p.CHARGES_DRAWN_PCT },
        { label: "Steals", val: p.STL, pct: p.STL_PCT },
        { label: "Blocks", val: p.BLK, pct: p.BLK_PCT },
        { label: "Defensive Reb %", val: p.DREB_PCT != null ? p.DREB_PCT + "%" : "-", pct: p.DREB_PCT_PCT },
        { label: "Defensive Win Shares", val: p.DEF_WS, pct: p.DEF_WS_PCT }
      ];

      document.getElementById("modalBars").innerHTML = metrics.map(m => {
        const pct = m.pct ?? 0;
        return `
          <div class="bar-row">
            <div><strong>${m.label}</strong> <span style="color:var(--muted)">(${m.val ?? "-"})</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${pctColor(m.pct)}"></div></div>
            <div style="text-align:right"><span class="pct-pill" style="background:${pctColor(m.pct)}">${m.pct ?? "-"}</span></div>
          </div>
        `;
      }).join("");

      document.getElementById("playerModal").classList.add("open");
    }

    document.getElementById("closeModalBtn").addEventListener("click", () => {
      document.getElementById("playerModal").classList.remove("open");
    });

    document.getElementById("playerModal").addEventListener("click", (e) => {
      if (e.target.id === "playerModal") {
        e.target.classList.remove("open");
      }
    });

    document.getElementById("viewSelect").addEventListener("change", (e) => {
      currentView = e.target.value;
      sortKey = currentView === "defense" ? "D_FG_PCT" : "PTS";
      sortAsc = currentView === "defense";
      loadDataset();
    });

    document.getElementById("rangeSelect").addEventListener("change", (e) => {
      currentRange = e.target.value;
      renderTable();
    });

    document.getElementById("seasonSelect").addEventListener("change", loadDataset);
    document.getElementById("teamSelect").addEventListener("change", renderTable);
    document.getElementById("minGpInput").addEventListener("input", renderTable);
    document.getElementById("searchInput").addEventListener("input", renderTable);

    loadDataset();
  </script>
</body>
</html>
